<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentTrader v2.0 - Algorithmic & Agentic Trading App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            slate: {
              950: '#070a11',
              900: '#0f172a',
              850: '#131e32',
              800: '#1e293b',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #070a11; color: #f8fafc; }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-gain { background: rgba(16, 185, 129, 0.12); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-loss { background: rgba(244, 63, 94, 0.12); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }
    .badge-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-neutral { background: rgba(148, 163, 184, 0.12); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.2); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070a11; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [portfolio, setPortfolio] = useState(null);
      const [snapshots, setSnapshots] = useState([]);
      const [watchlist, setWatchlist] = useState([]);
      const [strategies, setStrategies] = useState([]);
      const [orders, setOrders] = useState([]);
      const [agentLogs, setAgentLogs] = useState([]);
      const [webhooks, setWebhooks] = useState({});
      const [agentConfig, setAgentConfig] = useState({});
      
      const [selectedSymbol, setSelectedSymbol] = useState('SPY');
      const [quote, setQuote] = useState(null);
      const [candles, setCandles] = useState([]);
      const [indicators, setIndicators] = useState(null);
      const [agentAnalysis, setAgentAnalysis] = useState(null);
      const [agentLoading, setAgentLoading] = useState(false);

      const [tradeModalSymbol, setTradeModalSymbol] = useState(null);
      const [profileModalSymbol, setProfileModalSymbol] = useState(null);
      const [profileData, setProfileData] = useState(null);
      const [profileLoading, setProfileLoading] = useState(false);
      const [simLoading, setSimLoading] = useState(false);
      const [evaluations, setEvaluations] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);

      const fetchData = async () => {
        try {
          const [p, s, w, st, o, l, wh, ac] = await Promise.all([
            fetch('/api/portfolio').then(r => r.json()),
            fetch('/api/portfolio/snapshots').then(r => r.json()),
            fetch('/api/watchlist').then(r => r.json()),
            fetch('/api/strategies').then(r => r.json()),
            fetch('/api/orders').then(r => r.json()),
            fetch('/api/agents/logs').then(r => r.json()),
            fetch('/api/webhooks').then(r => r.json()),
            fetch('/api/agents/config').then(r => r.json())
          ]);
          setPortfolio(p);
          setSnapshots(s);
          setWatchlist(w);
          setStrategies(st);
          setOrders(o);
          setAgentLogs(l);
          setWebhooks(wh);
          setAgentConfig(ac);
        } catch (e) {
          console.error(e);
        }
      };

      const fetchSymbolData = async (sym) => {
        try {
          const [q, c, ind] = await Promise.all([
            fetch(`/api/market/quote/${sym}`).then(r => r.json()),
            fetch(`/api/market/candles/${sym}`).then(r => r.json()),
            fetch(`/api/market/indicators/${sym}`).then(r => r.json())
          ]);
          setQuote(q);
          setCandles(c);
          setIndicators(ind);
        } catch (e) {
          console.error(e);
        }
      };

      const [goalText, setGoalText] = useState('High Growth AI & Cloud Infrastructure');
      const [riskTolerance, setRiskTolerance] = useState('Moderate');
      const [horizon, setHorizon] = useState('Medium-Term');
      const [goalResult, setGoalResult] = useState(null);
      const [goalLoading, setGoalLoading] = useState(false);
      const [isGoalForcing, setIsGoalForcing] = useState(false);
      const [allocateCapital, setAllocateCapital] = useState(10000);

      const runGoalPlanner = async (gText, rTol, hZon, force = false) => {
        setGoalLoading(true);
        setIsGoalForcing(force);
        try {
          const url = force ? '/api/agents/recommend_goal?force=true' : '/api/agents/recommend_goal';
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              goal_text: gText || goalText,
              risk_tolerance: rTol || riskTolerance,
              horizon: hZon || horizon,
              force_fresh: force
            })
          });
          if (res.ok) {
            const data = await res.json();
            setGoalResult(data);
          }
        } catch (e) {
          console.error(e);
        } finally {
          setGoalLoading(false);
          setIsGoalForcing(false);
        }
      };

      const handleAddAllGoalToWatchlist = async () => {
        if (!goalResult || !goalResult.recommended_assets) return;
        try {
          for (const item of goalResult.recommended_assets) {
            await fetch('/api/watchlist', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ symbol: item.symbol, notes: `Recommended for goal: ${goalResult.portfolio_name}` })
            });
          }
          await fetchData();
          alert(`Added ${goalResult.recommended_assets.length} assets to your Watchlist!`);
        } catch (e) {
          console.error(e);
        }
      };

      const handleAllocateGoalPortfolio = async () => {
        if (!goalResult || !goalResult.recommended_assets) return;
        if (!confirm(`Allocate $${allocateCapital.toLocaleString()} paper capital across ${goalResult.recommended_assets.length} recommended assets?`)) return;
        try {
          for (const item of goalResult.recommended_assets) {
            const dollars = (allocateCapital * (item.allocation_percent / 100.0));
            const shares = Math.max(0.001, parseFloat((dollars / item.current_price).toFixed(4)));
            if (shares > 0) {
              await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  symbol: item.symbol,
                  side: 'BUY',
                  shares: shares,
                  order_type: 'MARKET',
                  triggered_by: 'GOAL_PLANNER',
                  reasoning: `Auto-allocated from Goal Portfolio: ${goalResult.portfolio_name} (${item.allocation_percent}% allocation)`
                })
              });
            }
          }
          await fetchData();
          alert(`Successfully allocated $${allocateCapital.toLocaleString()} paper capital across ${goalResult.portfolio_name}!`);
        } catch (e) {
          console.error(e);
        }
      };

      const [isForcing, setIsForcing] = useState(false);

      const runAgentAnalysis = async (sym, force = false) => {
        setAgentLoading(true);
        setIsForcing(force);
        setSelectedSymbol(sym);
        try {
          const url = force ? `/api/agents/analyze/${sym}?force=true` : `/api/agents/analyze/${sym}`;
          const res = await fetch(url, { method: 'POST' });
          if (res.ok) setAgentAnalysis(await res.json());
          await fetchData();
        } catch (e) {
          console.error(e);
        } finally {
          setAgentLoading(false);
          setIsForcing(false);
        }
      };

      useEffect(() => {
        fetchData();
        fetchSymbolData(selectedSymbol);
      }, []);

      useEffect(() => {
        fetchSymbolData(selectedSymbol);
      }, [selectedSymbol]);

      const handleReset = async () => {
        if (confirm('Reset paper portfolio to $100,000 cash?')) {
          await fetch('/api/portfolio/reset', { method: 'POST' });
          await fetchData();
        }
      };

      const handleTick = async () => {
        setSimLoading(true);
        try {
          const res = await fetch('/api/simulation/tick', { method: 'POST' });
          if (res.ok) {
            const data = await res.json();
            setEvaluations(data.evaluations || []);
          }
          await fetchData();
        } catch (e) {
          console.error(e);
        } finally {
          setSimLoading(false);
        }
      };

      const handleOrder = async (orderData) => {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });
        if (!res.ok) {
          const err = await res.json();
          alert(err.error || 'Order failed');
        } else {
          await fetchData();
        }
      };

      const handleSaveWebhooks = async (e) => {
        e.preventDefault();
        await fetch('/api/webhooks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(webhooks)
        });
        alert('Webhook & Notification Settings saved successfully!');
        await fetchData();
      };

      const handleSaveAgentConfig = async (e) => {
        e.preventDefault();
        await fetch('/api/agents/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(agentConfig)
        });
        alert('Agent Configuration & Personalities updated successfully!');
        await fetchData();
      };

      const handleSearch = async (query) => {
        setSearchQuery(query);
        if (!query.trim()) {
          setSearchResults([]);
          return;
        }
        try {
          const res = await fetch(`/api/market/search?q=${encodeURIComponent(query)}`);
          if (res.ok) {
            setSearchResults(await res.json());
          }
        } catch (e) {
          console.error(e);
        }
      };

      const addWatchlist = async (sym) => {
        if (!sym) return;
        try {
          await fetch('/api/watchlist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ symbol: sym.toUpperCase() })
          });
          setSearchQuery('');
          setSearchResults([]);
          await fetchData();
        } catch (e) {
          console.error(e);
        }
      };

      const removeWatchlist = async (sym) => {
        try {
          await fetch(`/api/watchlist/${sym}`, { method: 'DELETE' });
          await fetchData();
        } catch (e) {
          console.error(e);
        }
      };

      const openProfile = async (sym) => {
        if (!sym) return;
        const targetSym = sym.toUpperCase();
        setProfileModalSymbol(targetSym);
        setProfileLoading(true);
        try {
          const res = await fetch(`/api/market/profile/${targetSym}`);
          if (res.ok) {
            setProfileData(await res.json());
          }
        } catch (e) {
          console.error(e);
        } finally {
          setProfileLoading(false);
        }
      };

      const netWorth = portfolio?.total_equity || 100000;
      const cash = portfolio?.cash_balance || 100000;
      const posVal = portfolio?.positions_value || 0;
      const pnl = portfolio?.cumulative_pnl || 0;
      const pnlPct = portfolio?.cumulative_pnl_percent || 0;
      const isGain = pnl >= 0;

      return (
        <div className="min-h-screen flex flex-col font-sans">
          
          {/* HEADER */}
          <header className="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 px-6 py-3">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-purple-600 to-emerald-500 p-0.5 flex items-center justify-center shadow-lg shadow-purple-500/20">
                  <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center font-bold text-purple-400 text-lg">🤖</div>
                </div>
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                    AgentTrader <span className="text-purple-400 text-xs font-semibold uppercase tracking-widest px-1.5 py-0.5 rounded bg-purple-500/10 border border-purple-500/20">v2.0 Enhanced</span>
                  </h1>
                  <p className="text-xs text-slate-400 flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    15-Min Cron & Trailing Stop Active (Gemini 3.8 Flash)
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-4 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2">
                <div className="border-r border-slate-800 pr-4">
                  <div className="text-[10px] text-slate-400 uppercase">Net Worth</div>
                  <div className="text-sm font-bold mono text-white">${netWorth.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
                </div>
                <div className="border-r border-slate-800 pr-4">
                  <div className="text-[10px] text-slate-400 uppercase">Cash</div>
                  <div className="text-sm font-semibold mono text-slate-300">${cash.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
                </div>
                <div>
                  <div className="text-[10px] text-slate-400 uppercase">Paper P&L</div>
                  <div className={`text-sm font-bold mono ${isGain ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {isGain ? '+' : ''}${pnl.toFixed(2)} ({isGain ? '+' : ''}{pnlPct.toFixed(2)}%)
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={handleTick}
                  disabled={simLoading}
                  className="flex items-center gap-1.5 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-medium text-xs px-3.5 py-2 rounded-lg transition-all shadow-md shadow-purple-500/20 active:scale-95 disabled:opacity-50"
                >
                  ⚡ {simLoading ? 'Executing Tick...' : 'Run Strategy Tick'}
                </button>
                <button
                  onClick={handleReset}
                  className="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg border border-slate-800"
                  title="Reset Portfolio to $100k"
                >
                  🔄
                </button>
              </div>

            </div>

            <div className="max-w-7xl mx-auto flex items-center gap-2 mt-3 pt-2 border-t border-slate-800/60 overflow-x-auto">
              {[
                { id: 'dashboard', label: '📊 Portfolio Dashboard' },
                { id: 'watchlist', label: '📈 Watchlist & Indicators' },
                { id: 'agents', label: '🤖 AI Agent Command Center' },
                { id: 'goal_planner', label: '🎯 Goal & Idea Planner' },
                { id: 'strategies', label: '⚡ Algo & Risk Veto Engine' },
                { id: 'webhooks', label: '💬 Notifications & Webhooks' },
                { id: 'history', label: '📜 Order History' },
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all ${
                    activeTab === tab.id
                      ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </header>

          {/* MAIN CONTENT */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
            
            {/* 1. DASHBOARD TAB */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="glass-card p-5">
                    <div className="text-xs text-slate-400 mb-1">Total Equity</div>
                    <div className="text-2xl font-bold mono text-white">${netWorth.toLocaleString(undefined, {minimumFractionDigits:2})}</div>
                    <div className="text-xs text-slate-500 mt-1">5% Trailing Stops Active</div>
                  </div>
                  <div className="glass-card p-5">
                    <div className="text-xs text-slate-400 mb-1">Available Cash</div>
                    <div className="text-2xl font-bold mono text-emerald-400">${cash.toLocaleString(undefined, {minimumFractionDigits:2})}</div>
                    <div className="text-xs text-slate-500 mt-1">10% Circuit Breaker Protected</div>
                  </div>
                  <div className="glass-card p-5">
                    <div className="text-xs text-slate-400 mb-1">Holdings Value</div>
                    <div className="text-2xl font-bold mono text-purple-400">${posVal.toLocaleString(undefined, {minimumFractionDigits:2})}</div>
                    <div className="text-xs text-slate-500 mt-1">{portfolio?.positions?.length || 0} active positions</div>
                  </div>
                  <div className="glass-card p-5">
                    <div className="text-xs text-slate-400 mb-1">Unrealized P&L</div>
                    <div className={`text-2xl font-bold mono ${portfolio?.unrealized_pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {portfolio?.unrealized_pnl >= 0 ? '+' : ''}${portfolio?.unrealized_pnl?.toFixed(2) || '0.00'}
                    </div>
                    <div className="text-xs text-slate-500 mt-1">Realized: ${portfolio?.realized_pnl?.toFixed(2) || '0.00'}</div>
                  </div>
                </div>

                {/* Positions Table with 5% Trailing Stop Prices */}
                <div className="glass-card overflow-hidden">
                  <div className="p-4 border-b border-slate-800 flex justify-between items-center">
                    <h3 className="text-sm font-bold text-slate-200">Active Paper Trading Positions & 5% Trailing Stops</h3>
                    <span className="text-xs text-slate-400 mono">{portfolio?.positions?.length || 0} Positions</span>
                  </div>
                  {(!portfolio?.positions || portfolio.positions.length === 0) ? (
                    <div className="p-8 text-center text-slate-500 text-xs">No active positions. Search tickers in Watchlist to trade!</div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left">
                        <thead className="bg-slate-900/60 text-xs text-slate-400 border-b border-slate-800">
                          <tr>
                            <th className="p-3">Symbol</th>
                            <th className="p-3">Asset</th>
                            <th className="p-3">Shares</th>
                            <th className="p-3">Avg Cost</th>
                            <th className="p-3">Current Price</th>
                            <th className="p-3">Peak Price</th>
                            <th className="p-3">5% Trailing Stop</th>
                            <th className="p-3">Unrealized P&L</th>
                            <th className="p-3 text-right">Action</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/40 text-xs">
                          {portfolio.positions.map((pos) => {
                            const isG = pos.unrealized_pnl >= 0;
                            return (
                              <tr key={pos.symbol} className="hover:bg-slate-900/40">
                                <td className="p-3 font-bold mono text-white">
                                  {pos.symbol}
                                  <button onClick={() => { runAgentAnalysis(pos.symbol); setActiveTab('agents'); }} className="ml-2 text-purple-400">🤖</button>
                                </td>
                                <td className="p-3"><span className={`badge ${pos.asset_type === 'ETF' ? 'badge-purple' : 'badge-blue'}`}>{pos.asset_type}</span></td>
                                <td className="p-3 mono">{pos.shares}</td>
                                <td className="p-3 mono">${pos.avg_cost.toFixed(2)}</td>
                                <td className="p-3 mono font-semibold text-white">${pos.current_price.toFixed(2)}</td>
                                <td className="p-3 mono text-slate-300">${pos.peak_price.toFixed(2)}</td>
                                <td className="p-3 mono font-bold text-rose-400">${pos.trailing_stop_price.toFixed(2)}</td>
                                <td className="p-3"><span className={`badge ${isG ? 'badge-gain' : 'badge-loss'} mono`}>{isG ? '+' : ''}${pos.unrealized_pnl.toFixed(2)} ({isG ? '+' : ''}{pos.pnl_percent.toFixed(2)}%)</span></td>
                                <td className="p-3 text-right">
                                  <button onClick={() => setTradeModalSymbol(pos.symbol)} className="px-2.5 py-1 text-xs bg-rose-500/10 text-rose-400 border border-rose-500/30 rounded">Close</button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* 2. WATCHLIST & INDICATORS TAB */}
            {activeTab === 'watchlist' && (
              <div className="space-y-6">
                {/* Watchlist & Add Ticker Header */}
                <div className="glass-card p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                  <div>
                    <h2 className="text-lg font-bold text-white">Market Explorer & Watchlist Manager</h2>
                    <p className="text-xs text-slate-400">Add Stock or ETF symbols to your active paper trading watchlist</p>
                  </div>

                  {/* Add Custom Ticker Direct Input Form */}
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      if (searchQuery.trim()) {
                        addWatchlist(searchQuery.trim().toUpperCase());
                      }
                    }}
                    className="flex items-center gap-2 w-full md:w-auto relative"
                  >
                    <div className="relative flex-1 md:w-64">
                      <input
                        type="text"
                        placeholder="Type ticker e.g. PLTR, AMD, NVDA..."
                        value={searchQuery}
                        onChange={(e) => handleSearch(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white mono uppercase focus:outline-none focus:border-blue-500"
                      />
                      {searchResults.length > 0 && (
                        <div className="absolute top-full left-0 right-0 mt-1 bg-slate-900 border border-slate-800 rounded-xl z-50 divide-y divide-slate-800 max-h-60 overflow-y-auto shadow-2xl">
                          {searchResults.map(s => (
                            <div key={s.symbol} className="p-3 hover:bg-slate-800/80 flex items-center justify-between text-xs transition-colors">
                              <div>
                                <span className="font-bold mono text-white">{s.symbol}</span>
                                <span className="ml-2 text-slate-400 text-[11px] truncate max-w-[140px] inline-block align-bottom">{s.name}</span>
                              </div>

                    {/* Header & Execution Source */}
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-4">
                      <div>
                        <div className="text-xs text-slate-400">Multi-Agent Recommended Strategy Portfolio:</div>
                        <h3 className="text-xl font-bold text-white mt-0.5">{goalResult.portfolio_name}</h3>
                        <p className="text-xs text-purple-300 italic mt-1 bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                          "{goalResult.overall_thesis}"
                        </p>
                      </div>

                      <div className="flex flex-col items-end gap-1 shrink-0">
                        <span className={`px-3 py-1 rounded-xl text-xs font-bold border flex items-center gap-1.5 ${!goalResult.is_cached ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' : 'bg-purple-500/20 text-purple-300 border-purple-500/40'}`}>
                          {!goalResult.is_cached ? `⚡ LIVE GEMINI API (${goalResult.latency_ms}ms)` : `💾 CACHED RESULT (${goalResult.cache_age_seconds}s)`}
                        </span>
                        <span className="text-[10px] text-slate-400 font-mono">
                          Source: {goalResult.execution_source}
                        </span>
                      </div>
                    </div>

                    {/* Action Toolbar for Recommended Portfolio */}
                    <div className="bg-slate-950/70 p-4 rounded-xl border border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                      <div>
                        <div className="text-xs font-bold text-white flex items-center gap-2">
                          🛍️ One-Click Auto-Allocate Paper Capital Across Portfolio
                        </div>
                        <p className="text-[11px] text-slate-400">Auto-calculate exact share quantities per stock according to allocation weight and execute paper market orders.</p>
                      </div>

                      <div className="flex items-center gap-2 w-full md:w-auto">
                        <span className="text-xs text-slate-400 font-mono">$</span>
                        <input
                          type="number"
                          step="500"
                          value={allocateCapital}
                          onChange={(e) => setAllocateCapital(parseFloat(e.target.value) || 0)}
                          className="w-28 px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-xs text-white mono"
                        />
                        <button
                          onClick={handleAllocateGoalPortfolio}
                          className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-lg transition-all shadow-md shadow-emerald-500/20 flex items-center gap-1 shrink-0"
                        >
                          🛍️ Auto-Allocate Portfolio
                        </button>
                        <button
                          onClick={handleAddAllGoalToWatchlist}
                          className="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-blue-300 border border-blue-500/30 font-semibold text-xs rounded-lg transition-all flex items-center gap-1 shrink-0"
                        >
                          ➕ Add All to Watchlist
                        </button>
                      </div>
                    </div>

                    {/* Grid of Recommended Assets */}
                    <div>
                      <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                        Recommended Assets ({goalResult.recommended_assets?.length || 0}) & Multi-Agent Stance
                      </h4>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {goalResult.recommended_assets?.map((asset, idx) => (
                          <div key={idx} className="bg-slate-900/80 p-5 rounded-xl border border-slate-800 space-y-4 hover:border-purple-500/30 transition-all">
                            
                            {/* Asset Header */}
                            <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                              <div>
                                <div className="flex items-center gap-2">
                                  <span className="text-lg font-bold text-white mono">{asset.symbol}</span>
                                  <span className="badge badge-neutral">{asset.asset_type}</span>
                                  <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${asset.consensus_action === 'BUY' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-blue-500/20 text-blue-300'}`}>
                                    {asset.consensus_action} ({asset.consensus_confidence}%)
                                  </span>
                                </div>
                                <div className="text-xs text-slate-400 mt-0.5">{asset.asset_name}</div>
                              </div>

                              <div className="text-right">
                                <div className="text-base font-bold text-white mono">${asset.current_price?.toFixed(2)}</div>
                                <div className="text-xs font-semibold text-purple-300 mono">{asset.allocation_percent}% Allocation</div>
                              </div>
                            </div>

                            {/* Allocation Progress Bar */}
                            <div>
                              <div className="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                                <div
                                  className="bg-gradient-to-r from-purple-500 to-blue-500 h-2 rounded-full transition-all duration-500"
                                  style={{ width: `${asset.allocation_percent}%` }}
                                ></div>
                              </div>
                            </div>

                            {/* Individual Agent Reasoning */}
                            <div className="space-y-2 text-[11px]">
                              <div className="bg-slate-950/60 p-2.5 rounded-lg border border-slate-800/80">
                                <strong className="text-emerald-400 block font-semibold">📈 Technical Analyst Stance:</strong>
                                <p className="text-slate-300 mt-0.5">{asset.technical_reasoning}</p>
                              </div>
                              <div className="bg-slate-950/60 p-2.5 rounded-lg border border-slate-800/80">
                                <strong className="text-blue-400 block font-semibold">📰 Sentiment Analyst Stance:</strong>
                                <p className="text-slate-300 mt-0.5">{asset.sentiment_reasoning}</p>
                              </div>
                              <div className="bg-slate-950/60 p-2.5 rounded-lg border border-slate-800/80">
                                <strong className="text-purple-400 block font-semibold">🛡️ Risk Manager Stance:</strong>
                                <p className="text-slate-300 mt-0.5">{asset.risk_reasoning}</p>
                              </div>
                            </div>

                            {/* Asset Actions */}
                            <div className="flex justify-end items-center gap-2 pt-2 border-t border-slate-800/60">
                              <button
                                onClick={() => openProfile(asset.symbol)}
                                className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-medium flex items-center gap-1"
                              >
                                ℹ️ Profile
                              </button>
                              <button
                                onClick={() => setTradeModalSymbol(asset.symbol)}
                                className="px-3 py-1 bg-blue-600/20 hover:bg-blue-600/40 text-blue-300 border border-blue-500/30 rounded text-xs font-semibold flex items-center gap-1"
                              >
                                🛍️ Trade Ticker
                              </button>
                            </div>

                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Risk & Diversification Summary */}
                    <div className="bg-slate-950/60 p-4 rounded-xl border border-slate-800 text-xs space-y-1">
                      <strong className="text-slate-300 font-semibold uppercase tracking-wider block">🛡️ Portfolio Risk & Diversification Assessment</strong>
                      <p className="text-slate-400 leading-relaxed">{goalResult.risk_summary}</p>
                    </div>

                  </div>
                )}

              </div>
            )}

            {/* 4. WEBHOOKS & NOTIFICATIONS TAB */}
            {activeTab === 'webhooks' && (
              <div className="glass-card p-6 space-y-4 max-w-2xl border-purple-500/30">
                <h2 className="text-lg font-bold text-white flex items-center gap-2">💬 Multi-Channel Webhook Notifications</h2>
                <p className="text-xs text-slate-400">Receive instant alerts for paper trades, stop losses, and AI signals on WhatsApp, Discord, or Telegram</p>

                <form onSubmit={handleSaveWebhooks} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">WhatsApp Recipient Phone Number</label>
                    <input
                      type="text"
                      placeholder="+1234567890"
                      value={webhooks.whatsapp_number || ''}
                      onChange={(e) => setWebhooks({ ...webhooks, whatsapp_number: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-white mono"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">Discord Webhook URL</label>
                    <input
                      type="text"
                      placeholder="https://discord.com/api/webhooks/..."
                      value={webhooks.discord_webhook_url || ''}
                      onChange={(e) => setWebhooks({ ...webhooks, discord_webhook_url: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-white mono"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-slate-400 mb-1">Telegram Bot Token</label>
                      <input
                        type="text"
                        placeholder="123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
                        value={webhooks.telegram_bot_token || ''}
                        onChange={(e) => setWebhooks({ ...webhooks, telegram_bot_token: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-white mono"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Telegram Chat ID</label>
                      <input
                        type="text"
                        placeholder="123456789"
                        value={webhooks.telegram_chat_id || ''}
                        onChange={(e) => setWebhooks({ ...webhooks, telegram_chat_id: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-white mono"
                      />
                    </div>
                  </div>

                  <button type="submit" className="px-5 py-2.5 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-bold rounded-xl shadow-lg">Save Notification Settings</button>
                </form>
              </div>
            )}

            {/* 5. STRATEGIES TAB */}
            {activeTab === 'strategies' && (
              <div className="glass-card p-6 space-y-4">
                <h2 className="text-xl font-bold text-white">Algorithmic Strategy & Risk Veto Engine</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {strategies.map(s => (
                    <div key={s.id} className="bg-slate-900 p-4 rounded-xl border border-slate-800 text-xs space-y-2">
                      <div className="font-bold text-white">{s.name} ({s.symbol})</div>
                      <div>Risk Manager Veto: <span className="text-emerald-400 font-bold">{s.risk_veto_enabled ? 'ENABLED' : 'DISABLED'}</span></div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 6. ORDER HISTORY TAB */}
            {activeTab === 'history' && (
              <div className="glass-card overflow-hidden">
                <div className="p-6 border-b border-slate-800 flex justify-between items-center">
                  <h2 className="text-lg font-bold text-white">Completed Paper Order Log</h2>
                  <span className="badge badge-blue mono">{orders.length} Executed</span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-900 text-slate-400 border-b border-slate-800">
                      <tr>
                        <th className="p-3">Time</th>
                        <th className="p-3">Symbol</th>
                        <th className="p-3">Side</th>
                        <th className="p-3">Shares</th>
                        <th className="p-3">Price</th>
                        <th className="p-3">Total Value</th>
                        <th className="p-3">Triggered By</th>
                        <th className="p-3">Reasoning</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/40">
                      {orders.map(o => (
                        <tr key={o.id} className="hover:bg-slate-900/40">
                          <td className="p-3 font-mono text-slate-400">{new Date(o.created_at || Date.now()).toLocaleTimeString()}</td>
                          <td className="p-3 font-bold mono text-white">{o.symbol}</td>
                          <td className="p-3"><span className={`badge ${o.side === 'BUY' ? 'badge-gain' : 'badge-loss'} mono`}>{o.side}</span></td>
                          <td className="p-3 mono">{o.shares}</td>
                          <td className="p-3 mono">${o.price?.toFixed(2)}</td>
                          <td className="p-3 mono font-semibold">${o.total_value?.toFixed(2)}</td>
                          <td className="p-3"><span className="badge badge-purple">{o.triggered_by}</span></td>
                          <td className="p-3 text-slate-300 max-w-xs truncate">{o.reasoning}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* STOCK PROFILE & RELATED STOCKS MODAL */}
            {profileModalSymbol && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
                <div className="glass-card max-w-3xl w-full p-6 space-y-6 border-purple-500/40 my-8 shadow-2xl relative">

                  {/* Modal Header */}
                  <div className="flex justify-between items-start border-b border-slate-800 pb-4">
                    <div>
                      <div className="flex items-center gap-3">
                        <h2 className="text-2xl font-black text-white mono">{profileModalSymbol}</h2>
                        <span className={`badge ${profileData?.asset_type === 'ETF' ? 'badge-purple' : 'badge-blue'} text-xs px-2.5 py-0.5`}>
                          {profileData?.asset_type || 'Stock'}
                        </span>
                        {profileData?.sector && (
                          <span className="badge bg-slate-800 text-slate-300 border border-slate-700 text-xs px-2.5 py-0.5">
                            {profileData.sector}
                          </span>
                        )}
                      </div>
                      <p className="text-sm text-slate-400 font-medium mt-1">{profileData?.name || profileModalSymbol}</p>
                    </div>
                    <button
                      onClick={() => { setProfileModalSymbol(null); setProfileData(null); }}
                      className="text-slate-400 hover:text-white p-2 rounded-xl bg-slate-900 border border-slate-800 text-sm font-bold"
                    >
                      ✕ Close
                    </button>
                  </div>

                  {profileLoading ? (
                    <div className="p-12 text-center text-purple-400 text-sm animate-pulse flex items-center justify-center gap-2">
                      ⚡ Loading complete company profile & financial fundamentals...
                    </div>
                  ) : profileData && (
                    <div className="space-y-6">

                      {/* Current Price & Day Change */}
                      <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900/80 p-4 rounded-xl border border-slate-800 gap-4">
                        <div>
                          <span className="text-xs text-slate-400 block">Current Market Price</span>
                          <span className="text-3xl font-black text-white mono">${profileData.current_price?.toFixed(2)}</span>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className={`px-3 py-1 rounded-lg text-sm font-bold mono ${profileData.change >= 0 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-rose-500/20 text-rose-400 border border-rose-500/40'}`}>
                            {profileData.change >= 0 ? '+' : ''}${profileData.change?.toFixed(2)} ({profileData.change >= 0 ? '+' : ''}{profileData.percent_change?.toFixed(2)}%)
                          </span>
                        </div>
                      </div>

                      {/* Company Overview Description */}
                      <div>
                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Company Overview & Business Model</h3>
                        <p className="text-xs text-slate-300 bg-slate-950/60 p-4 rounded-xl border border-slate-800 leading-relaxed">
                          {profileData.description}
                        </p>
                      </div>

                      {/* Fundamental Financial Metrics Grid */}
                      <div>
                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Key Financial Fundamentals</h3>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                          <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <span className="text-slate-400 block">Market Cap</span>
                            <strong className="text-white mono text-sm font-bold">
                              {profileData.market_cap >= 1e12 ? `$${(profileData.market_cap / 1e12).toFixed(2)}T` : (profileData.market_cap >= 1e9 ? `$${(profileData.market_cap / 1e9).toFixed(2)}B` : `$${(profileData.market_cap / 1e6).toFixed(2)}M`)}
                            </strong>
                          </div>

                          <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <span className="text-slate-400 block">P/E Ratio (TTM)</span>
                            <strong className="text-white mono text-sm font-bold">{profileData.pe_ratio}x</strong>
                          </div>

                          <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <span className="text-slate-400 block">Forward P/E</span>
                            <strong className="text-white mono text-sm font-bold">{profileData.forward_pe}x</strong>
                          </div>

                          <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <span className="text-slate-400 block">Dividend Yield</span>
                            <strong className="text-emerald-400 mono text-sm font-bold">{profileData.dividend_yield}%</strong>
                          </div>

                          <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <span className="text-slate-400 block">Beta Volatility</span>
                            <strong className="text-white mono text-sm font-bold">{profileData.beta}</strong>
                          </div>

                          <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <span className="text-slate-400 block">EPS (TTM)</span>
                            <strong className="text-white mono text-sm font-bold">${profileData.eps}</strong>
                          </div>

                          <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <span className="text-slate-400 block">52-Wk High</span>
                            <strong className="text-white mono text-sm font-bold">${profileData.week52_high}</strong>
                          </div>

                          <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <span className="text-slate-400 block">52-Wk Low</span>
                            <strong className="text-white mono text-sm font-bold">${profileData.week52_low}</strong>
                          </div>
                        </div>
                      </div>

                      {/* Related Competitors & Similar Stocks */}
                      {profileData.related_stocks && profileData.related_stocks.length > 0 && (
                        <div>
                          <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                            🔗 Related Stocks & Competitors
                          </h3>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            {profileData.related_stocks.map(rel => (
                              <div key={rel.symbol} className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                                <div>
                                  <span className="font-bold mono text-white text-sm">{rel.symbol}</span>
                                  <span className="ml-2 text-[10px] text-slate-400">{rel.name}</span>
                                </div>
                                <div className="flex gap-2">
                                  <button
                                    onClick={() => openProfile(rel.symbol)}
                                    className="px-2.5 py-1 bg-purple-600/30 hover:bg-purple-600/50 text-purple-300 border border-purple-500/40 rounded-lg text-[11px] font-semibold flex items-center gap-1"
                                  >
                                    ℹ️ Info
                                  </button>
                                  <button
                                    onClick={() => addWatchlist(rel.symbol)}
                                    className="px-2.5 py-1 bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 border border-blue-500/40 rounded-lg text-[11px] font-semibold flex items-center gap-1"
                                  >
                                    ➕ Add
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* Action Footer Buttons */}
                      <div className="flex flex-wrap gap-3 border-t border-slate-800 pt-4">
                        <button
                          onClick={() => { addWatchlist(profileModalSymbol); }}
                          className="px-4 py-2 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-bold text-xs rounded-xl shadow-lg hover:from-blue-500 hover:to-cyan-500 transition-all flex items-center gap-1.5"
                        >
                          ➕ Add {profileModalSymbol} to Watchlist
                        </button>
                        <button
                          onClick={() => { runAgentAnalysis(profileModalSymbol); setActiveTab('agents'); setProfileModalSymbol(null); }}
                          className="px-4 py-2 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-bold text-xs rounded-xl shadow-lg hover:from-purple-500 hover:to-blue-500 transition-all flex items-center gap-1.5"
                        >
                          🤖 Run AI Debate
                        </button>
                        <button
                          onClick={() => { setTradeModalSymbol(profileModalSymbol); setProfileModalSymbol(null); }}
                          className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-xl border border-slate-700 transition-all flex items-center gap-1.5"
                        >
                          🛍️ Trade {profileModalSymbol}
                        </button>
                      </div>

                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
