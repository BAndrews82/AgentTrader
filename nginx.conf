# Nginx Network-Wide Reverse Proxy Configuration for AgentTrader
# Location: /etc/nginx/sites-available/agenttrader (or /etc/nginx/conf.d/agenttrader.conf)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # Catch-all for any IP address or domain name on your local network
    server_name _;

    # Proxy all HTTP requests to AgentTrader backend running locally on port 8000
    location / {
        proxy_pass http://127.0.0.1:8000;

        # Forward Original Client IP and Network Host Headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & Streaming support for real-time market quotes and AI agent updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 5-minute timeouts for long AI multi-agent debate sessions
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
